plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aceboost'
    compileSdk 34

    defaultConfig {
        applicationId "com.aceboost"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
